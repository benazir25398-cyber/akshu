
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to Akshu's Birthday</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="countdown-page">

    <div class="countdown-card">

        <h1>Counting Down to Your Day! 🎉</h1>

        <h2>Akshu Ma's Birthday 💗</h2>

        <p>Someone special is about to turn a year older!</p>

        <div class="timer">

            <div class="time-box">
                <span id="days">00</span>
                <p>Days</p>
            </div>

            <div class="time-box">
                <span id="hours">00</span>
                <p>Hours</p>
            </div>

            <div class="time-box">
                <span id="minutes">00</span>
                <p>Minutes</p>
            </div>

            <div class="time-box">
                <span id="seconds">00</span>
                <p>Seconds</p>
            </div>

        </div>

        <p class="countdown-note">
            Every second brings us closer to celebrating YOU! 🥹
        </p>

        <a href="memories.html" class="start-button">
            Let's See Our Memories 📸
        </a>

    </div>

    <script src="script.js"></script>

</body>
</html>
